<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sales App iOS</title>
    <!-- SweetAlert2 (Modern Popups) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <style>
        /* iOS STYLE UI */
        :root {
            --ios-bg: #f2f2f7; --ios-card: #ffffff; --ios-blue: #007aff;
            --ios-text: #1c1c1e; --ios-gray: #8e8e93;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            background-color: var(--ios-bg); color: var(--ios-text); margin: 0; padding-bottom: 80px; 
        }
        .hidden { display: none !important; }
        
        /* Typography & Header */
        h4 { font-weight: 700; font-size: 24px; margin-bottom: 20px; }
        .app-header { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(15px); padding: 20px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #e5e5ea; }
        
        /* Cards & Inputs */
        .ios-card { background: var(--ios-card); border-radius: 16px; padding: 20px; margin: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; color: var(--ios-gray); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;}
        .ios-input { width: 100%; background: var(--ios-bg); border: 2px solid transparent; border-radius: 12px; padding: 14px; font-size: 16px; color: var(--ios-text); outline: none; transition: 0.3s; box-sizing: border-box; }
        .ios-input:focus { border-color: var(--ios-blue); background: #fff; }
        .ios-input:read-only { opacity: 0.7; }
        
        /* Chips (Multi-select) */
        .chip-container { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
        .ios-chip { background: #e5e5ea; border: none; padding: 10px 18px; border-radius: 20px; font-size: 14px; font-weight: 600; color: var(--ios-text); cursor: pointer; transition: 0.2s; }
        .ios-chip.active { background: var(--ios-blue); color: white; transform: scale(1.05); }

        /* Dynamic Channel Block */
        .channel-block { background: #fafafa; border-radius: 12px; padding: 15px; margin-bottom: 15px; border-left: 4px solid var(--ios-blue); animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Buttons */
        .ios-btn { background: var(--ios-blue); color: white; border: none; width: 100%; padding: 16px; border-radius: 14px; font-size: 17px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .ios-btn:active { transform: scale(0.98); opacity: 0.9; }
        .ios-btn-warning { background: #ff9500; }

        /* Bottom Tab Navigation */
        .tab-bar { position: fixed; bottom: 0; width: 100%; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px); border-top: 1px solid #e5e5ea; display: flex; justify-content: space-around; padding: 12px 0 25px 0; z-index: 1000; }
        .tab-item { text-align: center; color: var(--ios-gray); font-size: 11px; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .tab-item i { font-size: 22px; display: block; margin-bottom: 3px; }
        .tab-item.active { color: var(--ios-blue); }

        /* History List */
        .history-item { padding: 15px; border-bottom: 1px solid #e5e5ea; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .history-item:last-child { border-bottom: none; }
        .h-date { font-weight: 600; font-size: 16px; }
        .h-sub { font-size: 13px; color: var(--ios-gray); }
    </style>
</head>
<body>

    <!-- SECTION: LOGIN -->
    <div id="loginSection" class="ios-card" style="max-width: 350px; margin: 100px auto;">
        <h4 style="text-align: center; margin-bottom: 30px;">Login App</h4>
        <div class="input-group">
            <input type="text" id="loginUser" class="ios-input" placeholder="Username">
        </div>
        <div class="input-group">
            <input type="password" id="loginPass" class="ios-input" placeholder="Password">
        </div>
        <button onclick="login()" id="btnLogin" class="ios-btn mt-3">Masuk</button>
    </div>

    <!-- SECTION: MAIN APP -->
    <div id="appSection" class="hidden">
        
        <div class="app-header">
            <h4 style="margin: 0;">Halo, <span id="staffName" style="color: var(--ios-blue);"></span> 👋</h4>
            <div style="font-size: 12px; color: var(--ios-gray); margin-top: 5px;">
                Pajak: <b id="infoPajak">0</b>% | Target: Rp <b id="infoTarget">0</b>
            </div>
        </div>

        <!-- 1. TAB: FORM INPUT -->
        <div id="tabForm" class="tab-content">
            <div class="ios-card">
                <form id="salesForm" onsubmit="submitData(event)">
                    
                    <div class="input-group">
                        <label>Tanggal Input</label>
                        <input type="date" id="inputDate" class="ios-input" onchange="checkDate()" required>
                    </div>

                    <div style="display: flex; gap: 15px;">
                        <div class="input-group" style="flex: 1;">
                            <label>Internal View</label>
                            <input type="number" id="internalView" class="ios-input" oninput="calcTotalView()">
                        </div>
                        <div class="input-group" style="flex: 1;">
                            <label>Customer View</label>
                            <input type="number" id="customerView" class="ios-input" oninput="calcTotalView()">
                        </div>
                    </div>
                    
                    <div style="display: flex; gap: 15px;">
                        <div class="input-group" style="flex: 1;">
                            <label>Total View (Auto)</label>
                            <input type="number" id="totalView" class="ios-input" readonly>
                        </div>
                        <div class="input-group" style="flex: 1;">
                            <label>Total Chats</label>
                            <input type="number" id="totalChats" class="ios-input">
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Sales Input (Otomatis)</label>
                        <input type="text" id="salesInput" class="ios-input" readonly>
                    </div>

                    <hr style="border: 0; border-top: 1px solid #e5e5ea; margin: 25px 0;">

                    <label style="font-size: 13px; font-weight: 600; color: var(--ios-gray); margin-bottom: 10px; display: block;">PILIH CHANNEL (BISA MULTIPLE)</label>
                    <div class="chip-container" id="channelChips">
                        <button type="button" class="ios-chip" onclick="toggleChannel('TAB')">TAB</button>
                        <button type="button" class="ios-chip" onclick="toggleChannel('Rupa')">Rupa-Rupa</button>
                        <button type="button" class="ios-chip" onclick="toggleChannel('Shopee')">Shopee</button>
                        <button type="button" class="ios-chip" onclick="toggleChannel('Storemode')">Storemode</button>
                        <button type="button" class="ios-chip" onclick="toggleChannel('Tokopedia')">Tokopedia</button>
                        <button type="button" class="ios-chip" onclick="toggleChannel('TikTok')">TikTok</button>
                        <button type="button" class="ios-chip" onclick="toggleChannel('Grab')">Grab Mart</button>
                        <button type="button" class="ios-chip" onclick="toggleChannel('Project')">Project</button>
                    </div>

                    <!-- Wadah Dinamis untuk Multi Channel -->
                    <div id="multiChannelForms"></div>

                    <button type="submit" id="btnSubmit" class="ios-btn" style="margin-top: 20px;">Simpan & Kalkulasi</button>
                </form>
            </div>
        </div>

        <!-- 2. TAB: HISTORY -->
        <div id="tabHistory" class="tab-content hidden">
            <div class="ios-card" style="padding: 0; overflow: hidden;">
                <div style="padding: 20px; background: #f9f9f9; border-bottom: 1px solid #e5e5ea;">
                    <h4 style="margin: 0; font-size: 18px;">Riwayat Input Anda</h4>
                    <span style="font-size: 12px; color: var(--ios-gray);">Ketuk untuk mengedit data.</span>
                </div>
                <div id="historyList">
                    <!-- Data history dirender di sini -->
                </div>
            </div>
        </div>

        <!-- 3. TAB: ADMIN -->
        <div id="tabAdmin" class="tab-content hidden">
            <div class="ios-card">
                <h4 style="color: #ff9500;">Admin Panel</h4>
                <div class="input-group">
                    <label>Setting Pajak (%)</label>
                    <input type="number" id="setPajak" class="ios-input">
                </div>
                <div class="input-group">
                    <label>Setting Target Monthly (Rp)</label>
                    <input type="number" id="setTarget" class="ios-input">
                </div>
                <button onclick="saveAdmin()" id="btnSaveAdmin" class="ios-btn ios-btn-warning">Simpan Pengaturan</button>
            </div>
        </div>

        <!-- BOTTOM TAB BAR -->
        <div class="tab-bar">
            <div class="tab-item active" id="navForm" onclick="switchTab('Form')"><i class="bi bi-pencil-square"></i>Form</div>
            <div class="tab-item" id="navHistory" onclick="switchTab('History')"><i class="bi bi-clock-history"></i>History</div>
            <div class="tab-item hidden" id="navAdmin" onclick="switchTab('Admin')"><i class="bi bi-gear-fill"></i>Admin</div>
            <div class="tab-item" onclick="logout()"><i class="bi bi-box-arrow-right text-danger"></i><span style="color:#ff3b30">Logout</span></div>
        </div>

    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // GANTI DENGAN URL WEB APP TERBARU ANDA
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxZQoQCTEh8blGlGJ1ZUB5EZJqx1JBXZ4ghU0XyrmU80LqV13RMPh0wmuN0U8f6rG1E/exec'; 
        
        let currentPajak = 0;
        let todayStr = new Date().toISOString().split('T')[0];
        let activeChannels = []; 

        window.onload = () => {
            document.getElementById('inputDate').value = todayStr;
            const user = localStorage.getItem("loggedInUser");
            const role = localStorage.getItem("userRole");
            
            if (user) {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('appSection').classList.remove('hidden');
                document.getElementById('staffName').innerText = user;
                document.getElementById('salesInput').value = user; // Auto-fill Username
                
                if (role === 'Admin') document.getElementById('navAdmin').classList.remove('hidden');
                initData(todayStr);
            }
        };

        // --- SISTEM POPUP (SWEETALERT2) ---
        function toastSuccess(msg) {
            Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: msg, showConfirmButton: false, timer: 3000 });
        }
        function alertIOS(title, text, icon="info") {
            return Swal.fire({ title: title, text: text, icon: icon, confirmButtonText: 'Oke', confirmButtonColor: '#007aff', borderRadius: '16px' });
        }

        function login() {
            const u = document.getElementById('loginUser').value;
            const p = document.getElementById('loginPass').value;
            document.getElementById('btnLogin').innerText = 'Loading...';

            fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: "login", username: u, password: p }) })
            .then(res => res.json()).then(data => {
                if (data.status === "success") {
                    localStorage.setItem("loggedInUser", data.user);
                    localStorage.setItem("userRole", data.role);
                    location.reload();
                } else {
                    alertIOS("Gagal", data.message, "error");
                    document.getElementById('btnLogin').innerText = 'Masuk';
                }
            });
        }

        function logout() {
            Swal.fire({
                title: 'Logout', text: "Yakin ingin keluar?", icon: 'warning',
                showCancelButton: true, confirmButtonColor: '#ff3b30', cancelButtonColor: '#8e8e93',
                confirmButtonText: 'Keluar'
            }).then((result) => { if (result.isConfirmed) { localStorage.clear(); location.reload(); } });
        }

        // --- TAB NAVIGATION ---
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab' + tabName).classList.remove('hidden');
            document.getElementById('nav' + tabName).classList.add('active');

            if (tabName === 'History') loadHistory();
        }

        // --- AUTO KALKULASI TOTAL VIEW ---
        function calcTotalView() {
            let iv = parseInt(document.getElementById('internalView').value) || 0;
            let cv = parseInt(document.getElementById('customerView').value) || 0;
            document.getElementById('totalView').value = iv + cv;
        }

        // --- FETCH INIT DATA & CEK TANGGAL ---
        function initData(selectedDate) {
            fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: "getInitData", username: localStorage.getItem("loggedInUser"), date: selectedDate }) })
            .then(res => res.json()).then(data => {
                currentPajak = parseFloat(data.pajak);
                document.getElementById('infoPajak').innerText = currentPajak;
                document.getElementById('infoTarget').innerText = parseFloat(data.target).toLocaleString('id-ID');
                document.getElementById('setPajak').value = currentPajak;
                document.getElementById('setTarget').value = data.target;

                if(data.existingData) {
                    Swal.fire({
                        title: 'Data Ditemukan', text: `Anda sudah memiliki data di tanggal ${selectedDate}. Ingin mengubah atau menambah data channel baru?`, icon: 'question',
                        showCancelButton: true, confirmButtonText: 'Ya, Ubah/Tambah', cancelButtonText: 'Batal'
                    }).then((result) => {
                        if(result.isConfirmed) {
                            fillFormWithExistingData(data.existingData);
                        } else {
                            document.getElementById('inputDate').value = todayStr;
                        }
                    });
                }
            });
        }

        function checkDate() {
            let selected = document.getElementById('inputDate').value;
            if (selected !== todayStr) {
                Swal.fire({
                    title: 'Tanggal Berbeda', text: `Anda memilih tanggal selain hari ini (${selected}). Yakin?`, icon: 'warning',
                    showCancelButton: true, confirmButtonText: 'Lanjutkan', cancelButtonText: 'Batal'
                }).then((r) => {
                    if(!r.isConfirmed) document.getElementById('inputDate').value = todayStr;
                    resetForm(); initData(document.getElementById('inputDate').value);
                });
            } else {
                resetForm(); initData(selected);
            }
        }

        // --- LOGIKA MULTI CHANNEL ---
        function toggleChannel(channel) {
            let chips = document.querySelectorAll('.ios-chip');
            let chip;
            chips.forEach(c => { if(c.innerText.includes(channel)) chip = c; });

            if (activeChannels.includes(channel)) {
                // Remove channel
                activeChannels = activeChannels.filter(c => c !== channel);
                chip.classList.remove('active');
                document.getElementById('form_' + channel).remove();
            } else {
                // Add channel
                activeChannels.push(channel);
                chip.classList.add('active');
                renderChannelForm(channel);
            }
        }

        function renderChannelForm(channel) {
            let container = document.getElementById('multiChannelForms');
            let div = document.createElement('div');
            div.className = 'channel-block';
            div.id = 'form_' + channel;
            
            div.innerHTML = `
                <div style="font-weight:700; color:var(--ios-blue); margin-bottom:10px;">➔ Data ${channel}</div>
                <div style="display:flex; gap:10px;">
                    <div class="input-group" style="flex:1;">
                        <label>Trx</label>
                        <input type="number" id="trx_${channel}" class="ios-input" required>
                    </div>
                    <div class="input-group" style="flex:1;">
                        <label>Sales</label>
                        <input type="number" id="sales_${channel}" class="ios-input" oninput="calcNetSales('${channel}')" required>
                    </div>
                </div>
                <div class="input-group">
                    <label>Net Sales (Auto - Pajak)</label>
                    <input type="number" id="net_${channel}" class="ios-input" readonly>
                </div>
            `;
            container.appendChild(div);
        }

        function calcNetSales(channel) {
            let sales = parseFloat(document.getElementById(`sales_${channel}`).value) || 0;
            let net = sales - (sales * (currentPajak / 100));
            document.getElementById(`net_${channel}`).value = net;
        }

        // --- SUBMIT MULTI DATA ---
        function submitData(e) {
            e.preventDefault();
            if(activeChannels.length === 0) { alertIOS("Perhatian", "Pilih minimal 1 channel untuk diinput!", "warning"); return; }
            
            let btn = document.getElementById('btnSubmit');
            btn.innerText = "Memproses..."; btn.disabled = true;

            let channelData = {};
            activeChannels.forEach(ch => {
                channelData[ch] = {
                    trx: document.getElementById(`trx_${ch}`).value,
                    sales: document.getElementById(`sales_${ch}`).value,
                    netSales: document.getElementById(`net_${ch}`).value
                };
            });

            let payload = {
                action: "submit",
                username: localStorage.getItem("loggedInUser"),
                date: document.getElementById('inputDate').value,
                internalView: document.getElementById('internalView').value,
                customerView: document.getElementById('customerView').value,
                totalView: document.getElementById('totalView').value,
                totalChats: document.getElementById('totalChats').value,
                channels: channelData
            };

            fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) })
            .then(res => res.json()).then(data => {
                alertIOS("Sukses", data.message, "success");
                resetForm();
                btn.innerText = "Simpan & Kalkulasi"; btn.disabled = false;
            }).catch(() => { alertIOS("Error", "Gagal menghubungi server", "error"); btn.disabled = false; });
        }

        // --- HISTORY MENU ---
        function loadHistory() {
            let container = document.getElementById('historyList');
            container.innerHTML = "<div style='padding:20px;text-align:center;'>Memuat data...</div>";
            
            fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: "getHistory", username: localStorage.getItem("loggedInUser") }) })
            .then(res => res.json()).then(data => {
                if(data.data.length === 0) {
                    container.innerHTML = "<div style='padding:20px;text-align:center;color:gray;'>Belum ada riwayat.</div>"; return;
                }
                
                let html = "";
                data.data.forEach(row => {
                    let dDate = row[1]; // Tanggal
                    let dDaily = parseFloat(row[33] || 0).toLocaleString('id-ID'); // Daily Sales
                    let htmlData = JSON.stringify(row).replace(/"/g, '&quot;');
                    
                    html += `
                        <div class="history-item" onclick="editHistory('${htmlData}')">
                            <div>
                                <div class="h-date">${new Date(dDate).toLocaleDateString('id-ID', {weekday: 'long', day: 'numeric', month: 'long'})}</div>
                                <div class="h-sub">Total Sales: Rp ${dDaily}</div>
                            </div>
                            <i class="bi bi-chevron-right" style="color:var(--ios-gray)"></i>
                        </div>
                    `;
                });
                container.innerHTML = html;
            });
        }

        // Mengisi form dari data history yang di klik
        function editHistory(rowDataStr) {
            Swal.fire({
                title: 'Edit Data?', text: "Buka form untuk mengubah data pada tanggal ini?", icon: 'question',
                showCancelButton: true, confirmButtonText: 'Ya, Edit'
            }).then((r) => {
                if(r.isConfirmed) {
                    let rowData = JSON.parse(rowDataStr);
                    document.getElementById('inputDate').value = rowData[1]; // Set tgl
                    fillFormWithExistingData(rowData);
                    switchTab('Form');
                }
            });
        }

        function fillFormWithExistingData(rowData) {
            resetForm();
            document.getElementById('internalView').value = rowData[4] || "";
            document.getElementById('customerView').value = rowData[5] || "";
            document.getElementById('totalView').value = rowData[6] || "";
            document.getElementById('totalChats').value = rowData[7] || "";
            
            // Map index ke channel (Penting!)
            let cMap = { "TAB": 8, "Rupa": 11, "Shopee": 14, "Storemode": 17, "Tokopedia": 20, "TikTok": 23, "Grab": 26, "Project": 29 };
            
            for (let ch in cMap) {
                let idx = cMap[ch];
                if (rowData[idx] || rowData[idx+1]) { // Jika trx atau sales ada nilainya
                    toggleChannel(ch); // Nyalakan toggle chip formnya
                    document.getElementById(`trx_${ch}`).value = rowData[idx];
                    document.getElementById(`sales_${ch}`).value = rowData[idx+1];
                    document.getElementById(`net_${ch}`).value = rowData[idx+2];
                }
            }
        }

        function resetForm() {
            activeChannels = [];
            document.getElementById('channelChips').querySelectorAll('.ios-chip').forEach(c => c.classList.remove('active'));
            document.getElementById('multiChannelForms').innerHTML = "";
            document.getElementById('internalView').value = "";
            document.getElementById('customerView').value = "";
            document.getElementById('totalView').value = "";
            document.getElementById('totalChats').value = "";
        }

        // --- ADMIN PANEL ---
        function saveAdmin() {
            let btn = document.getElementById('btnSaveAdmin'); btn.innerText = "Menyimpan...";
            let p = document.getElementById('setPajak').value;
            let t = document.getElementById('setTarget').value;
            fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: "updateSettings", username: localStorage.getItem("loggedInUser"), pajak: p, target: t }) })
            .then(res => res.json()).then(data => { alertIOS("Sukses", data.message, "success"); initData(todayStr); btn.innerText = "Simpan Pengaturan"; });
        }
    </script>
</body>
</html>
